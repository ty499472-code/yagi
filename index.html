<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>顔面トーナメント</title>
<style>
:root{
  --bg:#0c0e11;--bg2:#141820;--bg3:#1c2230;--bg4:#242c3a;
  --c1:#5DCAA5;--c2:#7F77DD;--danger:#e05555;--gold:#F5C842;
  --text:#dde2ea;--muted:#6b7685;
  --border:rgba(255,255,255,0.07);--r:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Helvetica Neue',Helvetica,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

/* === DEVICE PICKER === */
#device-picker{display:none;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:2rem}
.dp-logo{font-size:2.5rem;font-weight:800;letter-spacing:-1px}
.dp-logo span{color:var(--c1)}
.dp-sub{font-size:.95rem;color:var(--muted);text-align:center;max-width:280px;line-height:1.65}
.dp-row{display:flex;gap:16px}
.dp-btn{width:110px;height:110px;border-radius:16px;border:2px solid var(--border);background:var(--bg3);color:var(--text);font-size:2rem;font-weight:800;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;transition:all .2s}
.dp-btn span{font-size:.72rem;font-weight:400;color:var(--muted)}
.dp-btn:hover{border-color:var(--c1);background:rgba(93,202,165,.1);color:var(--c1)}
.dp-btn.b:hover{border-color:var(--c2);background:rgba(127,119,221,.1);color:var(--c2)}
.dp-note{font-size:.78rem;color:var(--muted)}

/* === APP === */
#app{display:none;flex-direction:column;height:100vh}
.header{display:flex;align-items:center;gap:12px;padding:12px 18px;background:var(--bg2);border-bottom:1px solid var(--border)}
.logo{font-size:1.2rem;font-weight:800;flex:1;letter-spacing:-.5px}
.logo span{color:var(--c1)}
.dev-badge{font-size:.78rem;font-weight:700;padding:4px 12px;border-radius:20px}
.dev-a{background:rgba(93,202,165,.15);color:var(--c1);border:1px solid rgba(93,202,165,.3)}
.dev-b{background:rgba(127,119,221,.15);color:var(--c2);border:1px solid rgba(127,119,221,.3)}

.tabs{display:flex;background:var(--bg2);border-bottom:1px solid var(--border);padding:0 14px}
.tab-btn{padding:11px 18px;background:none;border:none;border-bottom:2px solid transparent;color:var(--muted);font-size:.88rem;cursor:pointer;white-space:nowrap;transition:all .2s}
.tab-btn.active{color:var(--c1);border-bottom-color:var(--c1)}
.tab-btn:hover:not(.active){color:var(--text)}
.panel{flex:1;overflow-y:auto;flex-direction:column;display:none;gap:16px;padding:18px}

/* === CHAT === */
#tab-chat{padding:0;gap:0}
#msgs{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:10px}
.msg{display:flex;flex-direction:column;max-width:72%}
.msg.mine{align-self:flex-end;align-items:flex-end}
.msg.theirs{align-self:flex-start;align-items:flex-start}
.msg-who{font-size:.7rem;color:var(--muted);margin-bottom:3px}
.msg-bub{padding:9px 14px;border-radius:18px;font-size:.92rem;line-height:1.55;word-break:break-word}
.msg.mine .msg-bub{background:var(--c1);color:#071a11;border-bottom-right-radius:4px}
.msg.theirs .msg-bub{background:var(--bg3);border-bottom-left-radius:4px}
.msg-time{font-size:.68rem;color:var(--muted);margin-top:3px}
.chat-foot{display:flex;gap:10px;padding:12px 18px;background:var(--bg2);border-top:1px solid var(--border)}
.chat-foot input{flex:1;background:var(--bg3);border:1px solid var(--border);border-radius:24px;padding:10px 16px;color:var(--text);font-size:.92rem;outline:none}
.chat-foot input:focus{border-color:var(--c1)}
.btn-send{background:var(--c1);color:#000;border:none;border-radius:24px;padding:10px 20px;font-size:.88rem;font-weight:700;cursor:pointer;flex-shrink:0}

/* === PHOTOS === */
.sec-title{font-size:1rem;font-weight:700;margin-bottom:2px}
.sec-sub{font-size:.82rem;color:var(--muted);margin-bottom:12px}
.up-box{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:10px}
.up-box input[type=text],.up-box input[type=file]{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:9px 14px;color:var(--text);font-size:.9rem;outline:none;width:100%}
.up-box input:focus{border-color:var(--c1)}
.btn-prim{background:var(--c1);color:#000;border:none;border-radius:8px;padding:9px 20px;font-weight:700;font-size:.9rem;cursor:pointer;align-self:flex-start}
.btn-prim:disabled{opacity:.5;cursor:not-allowed}

#photo-list{display:flex;flex-direction:column;gap:14px;margin-top:8px}

/* 写真カード */
.p-card{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.p-card-top{display:flex;gap:14px;padding:14px}
.p-thumb{width:80px;height:80px;object-fit:cover;border-radius:10px;flex-shrink:0;border:1px solid var(--border)}
.p-info{flex:1;min-width:0}
.p-card-name{font-size:1rem;font-weight:700;margin-bottom:6px}
.p-score-status{font-size:.78rem;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.score-tag{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:10px;font-size:.72rem;font-weight:600}
.score-tag.done-a{background:rgba(93,202,165,.15);color:var(--c1)}
.score-tag.done-b{background:rgba(127,119,221,.15);color:var(--c2)}
.score-tag.pending{background:rgba(107,118,133,.15);color:var(--muted)}
.p-card-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.btn-xs{background:none;border:1px solid var(--border);color:var(--text);padding:5px 12px;border-radius:7px;font-size:.78rem;cursor:pointer;transition:all .2s}
.btn-xs:hover{border-color:var(--c1);color:var(--c1)}
.btn-xs.del:hover{border-color:var(--danger);color:var(--danger)}
.btn-xs.scored{border-color:rgba(93,202,165,.4);color:var(--c1)}

/* 採点テーブル */
.score-table-wrap{padding:0 14px 14px;display:none}
.score-table-wrap.open{display:block}
.score-table{width:100%;border-collapse:collapse;font-size:.82rem}
.score-table th{padding:7px 10px;text-align:center;color:var(--muted);font-weight:600;border-bottom:1px solid var(--border)}
.score-table th:first-child{text-align:left}
.score-table td{padding:7px 10px;text-align:center;border-bottom:1px solid var(--border)}
.score-table td:first-child{text-align:left;color:var(--muted)}
.score-table tr:last-child td{border-bottom:none;font-weight:700;color:var(--text)}
.col-a{color:var(--c1)}
.col-b{color:var(--c2)}
.col-avg{color:var(--gold)}
.chart-btn-row{display:flex;justify-content:flex-end;padding:0 14px 12px}

/* === SCORING MODAL === */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.82);display:none;align-items:center;justify-content:center;z-index:200;padding:16px}
.mbox{background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:22px;max-width:480px;width:100%;max-height:92vh;overflow-y:auto}
.mhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.mtitle{font-size:1rem;font-weight:700}
.msub{font-size:.8rem;color:var(--muted);margin-bottom:16px}
.mclose{background:none;border:none;color:var(--muted);font-size:1.5rem;cursor:pointer;line-height:1}
.sc-photo-row{display:flex;align-items:center;gap:12px;margin-bottom:18px;padding:12px;background:var(--bg3);border-radius:10px}
.sc-photo-img{width:56px;height:56px;object-fit:cover;border-radius:8px;flex-shrink:0}
.sc-photo-name{font-size:.95rem;font-weight:700}
.sc-photo-dev{font-size:.78rem;color:var(--muted);margin-top:2px}
.sl-row{margin-bottom:14px}
.sl-lbl{display:flex;justify-content:space-between;font-size:.85rem;margin-bottom:6px}
.sl-lbl strong{font-size:1rem}
.sl-lbl strong.col-a{color:var(--c1)}
.sl-lbl strong.col-b{color:var(--c2)}
input[type=range]{width:100%;accent-color:var(--c1);cursor:pointer}
.btn-sub{width:100%;background:var(--c1);color:#000;border:none;border-radius:10px;padding:11px;font-size:.95rem;font-weight:700;cursor:pointer;margin-top:8px}

/* === CHART MODAL === */
#ch-con{display:flex;gap:20px;flex-wrap:wrap;justify-content:center;padding:4px 0}
.ch-wrap{display:flex;flex-direction:column;align-items:center;gap:10px}
.ch-name{font-size:.9rem;font-weight:600;text-align:center}
.ch-total{font-size:1.3rem;font-weight:800}
.ch-leg{display:flex;flex-direction:column;gap:5px;width:100%}
.leg-item{display:flex;align-items:center;gap:7px;font-size:.78rem;color:var(--muted)}
.leg-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}

/* === TOURNAMENT === */
.t-act{display:flex;gap:10px;flex-wrap:wrap}
.btn-sec{background:none;border:1px solid var(--border);color:var(--text);padding:9px 18px;border-radius:8px;font-size:.88rem;cursor:pointer;transition:all .2s}
.btn-sec:hover{border-color:var(--c1);color:var(--c1)}
.empty{color:var(--muted);font-size:.9rem;padding:8px 0}
#bracket{display:flex;flex-direction:column;gap:14px}
.m-card{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:16px}
.m-label{font-size:.68rem;font-weight:700;letter-spacing:1.5px;color:var(--muted);margin-bottom:12px}
.m-row{display:flex;align-items:center;gap:12px}
.m-side{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;border-radius:10px;padding:10px;border:2px solid transparent}
.m-side.win{border-color:var(--gold);background:rgba(245,200,66,.07)}
.m-img{width:72px;height:72px;object-fit:cover;border-radius:10px;border:1px solid var(--border)}
.m-name{font-size:.82rem;font-weight:600;text-align:center}
.m-avg{font-size:1.2rem;font-weight:800;color:var(--gold)}
.m-avg span{font-size:.72rem;font-weight:400;color:var(--muted)}
.m-vs{font-size:.78rem;font-weight:800;color:var(--muted);flex-shrink:0}
.m-foot{display:flex;align-items:center;justify-content:space-between;margin-top:12px;flex-wrap:wrap;gap:8px}
.m-btns{display:flex;gap:8px}
.btn-sm{background:none;border:1px solid var(--border);color:var(--text);padding:6px 14px;border-radius:8px;font-size:.8rem;cursor:pointer;transition:all .2s}
.btn-sm:hover{border-color:var(--c1);color:var(--c1)}
.btn-sm.start{background:var(--c1);color:#000;border-color:var(--c1);font-weight:700}
.btn-sm.start:hover{opacity:.85}
.m-winner-banner{margin-top:10px;padding:8px 12px;border-radius:8px;text-align:center;font-size:.9rem;font-weight:700;background:rgba(245,200,66,.15);color:var(--gold)}

/* === BATTLE SCREEN === */
#battle-screen{display:none;position:fixed;inset:0;background:var(--bg);flex-direction:column;z-index:300;overflow-y:auto}
.bh{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;background:var(--bg2);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10}
.bh-title{font-size:1rem;font-weight:700}
.bh-sub{font-size:.78rem;color:var(--muted)}
.btn-back{background:none;border:1px solid var(--border);color:var(--muted);padding:6px 14px;border-radius:8px;font-size:.82rem;cursor:pointer}
.btn-back:hover{border-color:var(--danger);color:var(--danger)}

.battle-vs{display:flex;align-items:center;padding:20px 16px 12px;gap:8px}
.battle-fighter{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px}
.battle-img{width:120px;height:120px;object-fit:cover;border-radius:14px;border:3px solid var(--border)}
.battle-img.glow-a{border-color:var(--c1);box-shadow:0 0 20px rgba(93,202,165,.4)}
.battle-img.glow-b{border-color:var(--c2);box-shadow:0 0 20px rgba(127,119,221,.4)}
.battle-name{font-size:.95rem;font-weight:700;text-align:center}
.battle-score{font-size:1.6rem;font-weight:800}
.battle-score.col-a{color:var(--c1)}
.battle-score.col-b{color:var(--c2)}
.battle-vs-badge{font-size:1.6rem;font-weight:900;color:var(--muted);flex-shrink:0}

/* 採点比較テーブル */
.battle-table-wrap{padding:0 16px 16px}
.battle-table-title{font-size:.78rem;font-weight:700;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-bottom:10px}
.battle-table{width:100%;border-collapse:collapse;font-size:.82rem}
.battle-table th{padding:8px 10px;text-align:center;color:var(--muted);font-weight:600;border-bottom:1px solid var(--border)}
.battle-table th:first-child{text-align:left}
.battle-table td{padding:8px 10px;text-align:center;border-bottom:1px solid var(--border)}
.battle-table td:first-child{text-align:left;color:var(--muted)}
.battle-table tr.total-row td{border-bottom:none;font-weight:700;font-size:.9rem;color:var(--text)}
.cell-win{color:var(--c1);font-weight:700}
.cell-lose{color:var(--muted)}

/* 勝者投票 */
.vote-section{padding:0 16px 24px;display:flex;flex-direction:column;gap:12px}
.vote-title{font-size:.9rem;font-weight:700;text-align:center;color:var(--muted)}
.vote-btns{display:flex;gap:12px}
.vote-btn{flex:1;padding:14px 10px;border-radius:12px;border:2px solid var(--border);background:var(--bg3);color:var(--text);font-size:.9rem;font-weight:700;cursor:pointer;transition:all .2s;display:flex;flex-direction:column;align-items:center;gap:6px}
.vote-btn img{width:44px;height:44px;object-fit:cover;border-radius:8px}
.vote-btn:hover{border-color:var(--c1)}
.vote-btn.sel-a{background:rgba(93,202,165,.2);border-color:var(--c1);color:var(--c1)}
.vote-btn.sel-b{background:rgba(127,119,221,.2);border-color:var(--c2);color:var(--c2)}
.vote-status{display:flex;gap:10px;justify-content:center;font-size:.8rem;color:var(--muted)}
.vote-dot{display:inline-flex;align-items:center;gap:5px}
.vdot{width:20px;height:20px;border-radius:50%;background:var(--bg4);display:flex;align-items:center;justify-content:center;font-size:.65rem;font-weight:700;color:var(--muted)}
.vdot.on{background:var(--c1);color:#000}

/* 結果バナー */
.battle-result-banner{margin:0 16px 20px;padding:18px;border-radius:var(--r);text-align:center;display:none;flex-direction:column;gap:8px}
.battle-result-banner.show{display:flex}
.battle-result-banner.win{background:rgba(245,200,66,.12);border:1px solid rgba(245,200,66,.3)}
.battle-result-banner.draw{background:rgba(107,118,133,.12);border:1px solid rgba(107,118,133,.3)}
.brb-title{font-size:1.4rem;font-weight:800;color:var(--gold)}
.brb-sub{font-size:.82rem;color:var(--muted)}
.btn-done{background:var(--c1);color:#000;border:none;border-radius:10px;padding:11px 32px;font-size:.95rem;font-weight:700;cursor:pointer;align-self:center;margin-top:4px}
</style>
</head>
<body>

<!-- DEVICE PICKER -->
<div id="device-picker">
  <div class="dp-logo">顔面<span>トーナメント</span></div>
  <div class="dp-sub">このデバイスはどちらですか？<br>一度選ぶと固定されます</div>
  <div class="dp-row">
    <button class="dp-btn"   id="pick-a">A<span>デバイスA</span></button>
    <button class="dp-btn b" id="pick-b">B<span>デバイスB</span></button>
  </div>
  <div class="dp-note">※ リセット：ブラウザのlocalStorageを削除</div>
</div>

<!-- APP -->
<div id="app">
  <div class="header">
    <div class="logo">顔面<span>トーナメント</span></div>
    <div class="dev-badge" id="dev-badge"></div>
    <button id="btn-logout" style="display:none;background:none;border:1px solid var(--border);color:var(--muted);padding:5px 12px;border-radius:8px;font-size:.78rem;cursor:pointer;transition:all .2s">ログアウト</button>
  </div>
  <div class="tabs">
    <button class="tab-btn active" data-tab="chat">💬 チャット</button>
    <button class="tab-btn" data-tab="photos">📸 写真 &amp; 採点</button>
    <button class="tab-btn" data-tab="tournament">🏆 トーナメント</button>
  </div>

  <!-- CHAT -->
  <div id="tab-chat" class="panel" style="display:flex;padding:0;gap:0">
    <div id="msgs"></div>
    <div class="chat-foot">
      <input id="chat-inp" type="text" placeholder="ジムの時間を相談しよう… (Enter送信)">
      <button id="btn-send" class="btn-send">送信</button>
    </div>
  </div>

  <!-- PHOTOS & SCORING -->
  <div id="tab-photos" class="panel">
    <div>
      <div class="sec-title">写真を登録</div>
      <div class="sec-sub">登録後にA・B それぞれが採点してください</div>
      <div class="up-box">
        <input type="text" id="p-name" placeholder="名前（例: さくら、りんご）">
        <input type="file" id="p-file" accept="image/*">
        <button class="btn-prim" id="up-btn">登録する</button>
      </div>
    </div>
    <div>
      <div class="sec-title">登録済み写真</div>
      <div id="photo-list"></div>
    </div>
  </div>

  <!-- TOURNAMENT -->
  <div id="tab-tournament" class="panel">
    <div>
      <div class="sec-title">フォトバトル トーナメント</div>
      <div class="sec-sub">投票するボタンで採点表を確認しながら勝者を決定！</div>
      <div class="t-act">
        <button class="btn-prim" id="btn-gen">トーナメント生成</button>
        <button class="btn-sec"  id="btn-refresh">↻ 更新</button>
      </div>
    </div>
    <div id="bracket"></div>
  </div>
</div>

<!-- SCORING MODAL -->
<div class="overlay" id="sc-modal">
  <div class="mbox">
    <div class="mhead">
      <div class="mtitle">採点</div>
      <button class="mclose" id="sc-close">×</button>
    </div>
    <div class="msub" id="sc-sub"></div>
    <div style="text-align:center;margin-bottom:14px">
      <img id="sc-img" src="" alt="" style="width:100%;max-height:260px;object-fit:cover;border-radius:12px;border:2px solid var(--border)">
      <div style="margin-top:10px">
        <div id="sc-pname" style="font-size:1.1rem;font-weight:700"></div>
        <div id="sc-pdev" style="font-size:.8rem;color:var(--muted);margin-top:2px"></div>
      </div>
    </div>
    <div class="sl-row"><div class="sl-lbl"><span>輪郭</span><strong id="sv-contour" class="col-a">5</strong></div><input type="range" id="sl-contour" min="1" max="10" value="5"></div>
    <div class="sl-row"><div class="sl-lbl"><span>鼻</span><strong id="sv-nose" class="col-a">5</strong></div><input type="range" id="sl-nose" min="1" max="10" value="5"></div>
    <div class="sl-row"><div class="sl-lbl"><span>目</span><strong id="sv-eyes" class="col-a">5</strong></div><input type="range" id="sl-eyes" min="1" max="10" value="5"></div>
    <div class="sl-row"><div class="sl-lbl"><span>口</span><strong id="sv-mouth" class="col-a">5</strong></div><input type="range" id="sl-mouth" min="1" max="10" value="5"></div>
    <div class="sl-row"><div class="sl-lbl"><span>全体バランス</span><strong id="sv-balance" class="col-a">5</strong></div><input type="range" id="sl-balance" min="1" max="10" value="5"></div>
    <button class="btn-sub" id="sc-submit">採点を保存</button>
  </div>
</div>

<!-- CHART MODAL -->
<div class="overlay" id="ch-modal">
  <div class="mbox">
    <div class="mhead">
      <div class="mtitle" id="ch-title">採点グラフ</div>
      <button class="mclose" id="ch-close">×</button>
    </div>
    <div id="ch-con"></div>
  </div>
</div>

<!-- VOTE MODAL -->
<div class="overlay" id="vote-modal">
  <div class="mbox" style="max-width:540px">
    <div class="mhead">
      <div>
        <div class="mtitle" id="vote-match-title">MATCH 1</div>
        <div style="font-size:.78rem;color:var(--muted);margin-top:2px">採点表を確認して勝者に投票してください</div>
      </div>
      <button class="mclose" id="vote-close">×</button>
    </div>

    <!-- VS ヘッダー -->
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:14px">
      <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px">
        <img id="b-img-a" src="" alt="" style="width:90px;height:90px;object-fit:cover;border-radius:12px;border:3px solid var(--border)">
        <div style="font-size:.9rem;font-weight:700;text-align:center" id="b-name-a"></div>
        <div style="font-size:1.2rem;font-weight:800;color:var(--c1)" id="b-avg-a"></div>
      </div>

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const reader = new FileReader();
    reader.onload = e => {
      img.onload = () => {
        const MAX = 400;
        let w = img.width, h = img.height;
        if (w > MAX || h > MAX) {
          if (w > h) { h = Math.round(h*MAX/w); w = MAX; }
          else { w = Math.round(w*MAX/h); h = MAX; }
        }
        const cv = document.createElement("canvas");
        cv.width=w; cv.height=h;
        cv.getContext("2d").drawImage(img,0,0,w,h);
        resolve(cv.toDataURL("image/jpeg",0.6));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function uploadPhoto() {
  const nm = document.getElementById("p-name").value.trim();
  const fi = document.getElementById("p-file").files[0];
  if (!nm||!fi) { alert("名前とファイルを選んでください"); return; }
  const btn = document.getElementById("up-btn");
  btn.textContent="変換中…"; btn.disabled=true;
  try {
    const url = await fileToBase64(fi);
    await addDoc(collection(db,"photos"), { name:nm, url, scores:{}, at:serverTimestamp() });
    document.getElementById("p-name").value="";
    document.getElementById("p-file").value="";
    loadPhotos();
  } catch(e) { alert("エラー: "+e.message); }
  btn.textContent="登録する"; btn.disabled=false;
}

async function loadPhotos() {
  const snap = await getDocs(collection(db,"photos"));
  const list = document.getElementById("photo-list");
  list.innerHTML = "";
  snap.forEach(d => {
    const p = d.data();
    const scores = p.scores || {};
    const hasA = scores.A && CATS.every(c => scores.A[c] !== undefined);
    const hasB = scores.B && CATS.every(c => scores.B[c] !== undefined);

    // 平均スコア計算
    let avgTotal = null;
    if (hasA || hasB) {
      const sources = [];
      if (hasA) sources.push(CATS.map(c => scores.A[c]));
      if (hasB) sources.push(CATS.map(c => scores.B[c]));
      const merged = CATS.map((c,i) => avg(sources.map(s => s[i])));
      avgTotal = (avg(merged) * 10).toFixed(1);
    }

    const card = document.createElement("div");
    card.className = "p-card";
    card.innerHTML = `
      <div class="p-card-top">
        <img src="${p.url}" class="p-thumb">
        <div class="p-info">
          <div class="p-card-name">${esc(p.name)}</div>
          <div class="p-score-status">
            <span class="score-tag ${hasA?'done-a':'pending'}">A ${hasA?'採点済':'未採点'}</span>
            <span class="score-tag ${hasB?'done-b':'pending'}">B ${hasB?'採点済':'未採点'}</span>
            ${avgTotal ? `<span class="score-tag" style="background:rgba(245,200,66,.15);color:var(--gold)">平均 ${avgTotal}点</span>` : ""}
          </div>
          <div class="p-card-actions">
            <button class="btn-xs" data-action="score" data-id="${d.id}">✏ 採点する</button>
            ${(hasA||hasB) ? `<button class="btn-xs scored" data-action="table" data-id="${d.id}">📊 採点を見る</button>` : ""}
            ${(hasA&&hasB) ? `<button class="btn-xs" data-action="chart" data-id="${d.id}" style="border-color:rgba(127,119,221,.4);color:var(--c2)">🥧 グラフ</button>` : ""}
            <button class="btn-xs del" data-action="del" data-id="${d.id}">削除</button>
          </div>
        </div>
      </div>
      <div class="score-table-wrap" id="stable-${d.id}">
        ${buildScoreTable(scores, p.name)}
      </div>`;
    list.appendChild(card);

    card.querySelectorAll("[data-action]").forEach(btn => {
      btn.addEventListener("click", () => {
        const action = btn.dataset.action;
        const id = btn.dataset.id;
        if (action==="score") openScoring(id, p);
        if (action==="table") toggleTable(id);
        if (action==="chart") openChart(p.scores, p.name);
        if (action==="del") {
          if (confirm("削除しますか？")) deleteDoc(doc(db,"photos",id)).then(loadPhotos);
        }
      });
    });
  });
}

function buildScoreTable(scores, name) {
  const hasA = scores.A && CATS.every(c => scores.A[c] !== undefined);
  const hasB = scores.B && CATS.every(c => scores.B[c] !== undefined);
  if (!hasA && !hasB) return "";
  let rows = "";
  let totalA=0, totalB=0, totalAvg=0, cnt=0;
  PARAMS.forEach(p => {
    const va = hasA ? scores.A[p.key] : null;
    const vb = hasB ? scores.B[p.key] : null;
    const vals = [va, vb].filter(v => v !== null);
    const av = vals.length ? (vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(1) : "—";
    if (hasA) totalA += va;
    if (hasB) totalB += vb;
    if (vals.length) { totalAvg += parseFloat(av); cnt++; }
    rows += `<tr>
      <td>${p.label}</td>
      <td class="col-a">${va !== null ? va : "—"}</td>
      <td class="col-b">${vb !== null ? vb : "—"}</td>
      <td class="col-avg">${av}</td>
    </tr>`;
  });
  const avgA = hasA ? (totalA/PARAMS.length).toFixed(1) : "—";
  const avgB = hasB ? (totalB/PARAMS.length).toFixed(1) : "—";
  const avgAll = cnt ? (totalAvg/cnt).toFixed(1) : "—";
  rows += `<tr class="total-row">
    <td>平均</td>
    <td class="col-a">${avgA}</td>
    <td class="col-b">${avgB}</td>
    <td class="col-avg" style="color:var(--gold)">${avgAll}</td>
  </tr>`;
  return `<table class="score-table">
    <thead><tr>
      <th>項目</th>
      <th class="col-a">A</th>
      <th class="col-b">B</th>
      <th class="col-avg">平均</th>
    </tr></thead>
    <tbody>${rows}</tbody>
  </table>`;
}

// ===== CHART MODAL =====
function openChart(scores, name) {
  document.getElementById("ch-title").textContent = name + " — 採点グラフ";
  document.getElementById("ch-modal").style.display = "flex";
  const con = document.getElementById("ch-con");
  con.innerHTML = "";
  const colors = ["#5DCAA5","#7F77DD","#F0997B","#D4537E","#85B7EB"];
  const hasA = scores.A && CATS.every(c => scores.A[c] !== undefined);
  const hasB = scores.B && CATS.every(c => scores.B[c] !== undefined);
  const avgScores = CATS.map(c => {
    const vals = [];
    if (hasA) vals.push(scores.A[c]);
    if (hasB) vals.push(scores.B[c]);
    return avg(vals);
  });

  const datasets = [];
  if (hasA) datasets.push({ label:"A", vals: CATS.map(c=>scores.A[c]), color:"var(--c1)" });
  if (hasB) datasets.push({ label:"B", vals: CATS.map(c=>scores.B[c]), color:"var(--c2)" });
  if (hasA && hasB) datasets.push({ label:"平均", vals: avgScores, color:"var(--gold)" });

  datasets.forEach(ds => {
    const w = document.createElement("div"); w.className = "ch-wrap";
    const total = ds.vals.reduce((a,b)=>a+b,0)||1;
    const overallAvg = (avg(ds.vals)*10).toFixed(1);
    const title = document.createElement("div"); title.className = "ch-name";
    title.innerHTML = `デバイス ${ds.label}<br><span class="ch-total" style="color:${ds.color}">${overallAvg}点</span>`;
    const cv = document.createElement("canvas"); cv.width=180; cv.height=180;
    const leg = document.createElement("div"); leg.className = "ch-leg";
    w.appendChild(title); w.appendChild(cv); w.appendChild(leg); con.appendChild(w);
    const ctx = cv.getContext("2d");
    let ang = -Math.PI/2;
    ds.vals.forEach((v,i) => {
      const sl = (v/total)*Math.PI*2;
      ctx.beginPath(); ctx.moveTo(90,90); ctx.arc(90,90,82,ang,ang+sl); ctx.closePath();
      ctx.fillStyle = colors[i]; ctx.fill();
      const mid = ang+sl/2;
      ctx.fillStyle="#fff"; ctx.font="bold 10px sans-serif";
      ctx.textAlign="center"; ctx.textBaseline="middle";
      ctx.fillText(v.toFixed(1), 90+52*Math.cos(mid), 90+52*Math.sin(mid));
      ang += sl;
      const li = document.createElement("div"); li.className="leg-item";
      li.innerHTML=`<span class="leg-dot" style="background:${colors[i]}"></span>${PARAMS[i].label}: ${v.toFixed(1)}`;
      leg.appendChild(li);
    });
  });
}

document.getElementById("ch-close").addEventListener("click", () => {

});

// ===== TOURNAMENT =====
async function generateTournament() {
  const snap = await getDocs(collection(db,"photos"));
  let photos = [];
  snap.forEach(d => photos.push({ id:d.id }));
  if (photos.length < 2) { alert("写真が2枚以上必要です"); return; }
  shuffle(photos);
  const pairs = [];
  for (let i=0; i+1<photos.length; i+=2) pairs.push({ a:photos[i].id, b:photos[i+1].id });
  await setDoc(doc(db,"tournament","current"), { pairs, winners:{}, at:serverTimestamp() });
  alert("トーナメントを生成しました！");
  renderBracket();
}

async function renderBracket() {
  const el = document.getElementById("bracket");
  el.innerHTML = `<p class="empty">読み込み中…</p>`;
  const tSnap = await getDoc(doc(db,"tournament","current"));
  if (!tSnap.exists()) { el.innerHTML=`<p class="empty">まずトーナメントを生成してください</p>`; return; }
  const t = tSnap.data();
  const pSnap = await getDocs(collection(db,"photos"));
  const pm = {};
  pSnap.forEach(d => pm[d.id] = d.data());

  el.innerHTML = "";
  t.pairs.forEach((pair, pi) => {
    const pA = pm[pair.a], pB = pm[pair.b];
    if (!pA||!pB) return;
    const winnerVotes = t.winners?.["m"+pi] || {};
    const vA = Object.values(winnerVotes).filter(v=>v===pair.a).length;
    const vB = Object.values(winnerVotes).filter(v=>v===pair.b).length;
    const decided = vA>=2 || vB>=2; // 2票で確定（A+B両方または同一2票）
    const winnerId = decided ? (vA>vB?pair.a:pair.b) : null;

    const avgOf = (id) => {
      const p = pm[id]; if (!p?.scores) return null;
      const hasA = p.scores.A && CATS.every(c=>p.scores.A[c]!==undefined);
      const hasB = p.scores.B && CATS.every(c=>p.scores.B[c]!==undefined);
      if (!hasA&&!hasB) return null;
      const sources = [];
      if (hasA) sources.push(CATS.map(c=>p.scores.A[c]));
      if (hasB) sources.push(CATS.map(c=>p.scores.B[c]));
      const merged = CATS.map((_,i) => avg(sources.map(s=>s[i])));
      return (avg(merged)*10).toFixed(1);
    };

    const card = document.createElement("div");
    card.className = "m-card";
    card.innerHTML = `
      <div class="m-label">MATCH ${pi+1}</div>
      <div class="m-row">
        <div class="m-side ${winnerId===pair.a?'win':''}">
          <img src="${pA.url}" class="m-img">
          <div class="m-name">${esc(pA.name)}</div>
          ${avgOf(pair.a) ? `<div class="m-avg">${avgOf(pair.a)}<span>点</span></div>` : ""}
        </div>
        <div class="m-vs">VS</div>
        <div class="m-side ${winnerId===pair.b?'win':''}">
          <img src="${pB.url}" class="m-img">
          <div class="m-name">${esc(pB.name)}</div>
          ${avgOf(pair.b) ? `<div class="m-avg">${avgOf(pair.b)}<span>点</span></div>` : ""}
        </div>
      </div>
      ${winnerId ? `<div class="m-winner-banner">🏆 ${esc(pm[winnerId].name)} の勝利！</div>` : ""}
      <div class="m-foot">
        <div style="font-size:.78rem;color:var(--muted)">
          ${Object.keys(winnerVotes).length}名投票済み
        </div>
        <div class="m-btns">
          <button class="btn-sm start" data-action="battle" data-pi="${pi}">🗳 投票する</button>
        </div>
      </div>`;
    el.appendChild(card);
    card.querySelectorAll("[data-action='battle']").forEach(btn => {
      btn.addEventListener("click", () => openBattle(t, parseInt(btn.dataset.pi), pm));
    });
  });
}

document.getElementById("btn-gen").addEventListener("click", generateTournament);

// ===== VOTE MODAL =====
let _bState = null, _bUnsub = null;
let _allPairs = [], _allPm = {};

async function openBattle(t, pi, pm) {
  const pair = t.pairs[pi];
  const pA = pm[pair.a], pB = pm[pair.b];
  _bState = { t, pi, pair, pA, pB };
  _allPairs = t.pairs;
  _allPm = pm;

  document.getElementById("vote-match-title").textContent = `MATCH ${pi+1}`;
  document.getElementById("b-img-a").src = pA.url;
  document.getElementById("b-img-b").src = pB.url;
  document.getElementById("b-name-a").textContent = pA.name;
  document.getElementById("b-name-b").textContent = pB.name;
  document.getElementById("vote-img-a").src = pA.url;
  document.getElementById("vote-img-b").src = pB.url;
  document.getElementById("vote-name-a").textContent = pA.name;
  document.getElementById("vote-name-b").textContent = pB.name;

  buildBattleTable(pA, pB);
  document.getElementById("b-avg-a").textContent = calcAvgScore(pA) ?? "未採点";
  document.getElementById("b-avg-b").textContent = calcAvgScore(pB) ?? "未採点";

  document.getElementById("b-result").classList.remove("show","win","draw");
  document.getElementById("vote-btn-a").className = "vote-btn";
  document.getElementById("vote-btn-b").className = "vote-btn";
  document.getElementById("btn-next").style.display = "none";

  document.getElementById("vote-modal").style.display = "flex";

  // 投票ボタンのイベントを毎回付け替え
  const btnA = document.getElementById("vote-btn-a");
  const btnB = document.getElementById("vote-btn-b");
  const newBtnA = btnA.cloneNode(true);
  const newBtnB = btnB.cloneNode(true);
  btnA.parentNode.replaceChild(newBtnA, btnA);
  btnB.parentNode.replaceChild(newBtnB, btnB);
  newBtnA.addEventListener("click", () => castWinnerVote(pair.a));
  newBtnB.addEventListener("click", () => castWinnerVote(pair.b));

  if (_bUnsub) _bUnsub();
  _bUnsub = onSnapshot(doc(db,"tournament","current"), snap => {
    if (!snap.exists()) return;
    renderVoteStatus(snap.data().winners?.["m"+pi] || {}, snap.data());
  });
}

function calcAvgScore(p) {
  if (!p.scores) return null;
  const hasA = p.scores.A && CATS.every(c=>p.scores.A[c]!==undefined);
  const hasB = p.scores.B && CATS.every(c=>p.scores.B[c]!==undefined);
  if (!hasA&&!hasB) return null;
  const sources = [];
  if (hasA) sources.push(CATS.map(c=>p.scores.A[c]));
  if (hasB) sources.push(CATS.map(c=>p.scores.B[c]));
  const merged = CATS.map((_,i) => avg(sources.map(s=>s[i])));
  return (avg(merged)*10).toFixed(1)+"点";
}

function buildBattleTable(pA, pB) {
  const sA = pA.scores || {}, sB = pB.scores || {};
  const hasAa = sA.A && CATS.every(c=>sA.A[c]!==undefined);
  const hasBa = sA.B && CATS.every(c=>sA.B[c]!==undefined);
  const hasAb = sB.A && CATS.every(c=>sB.A[c]!==undefined);
  const hasBb = sB.B && CATS.every(c=>sB.B[c]!==undefined);

  // テーブルヘッダー再構築
  const thead = document.querySelector("#b-table thead tr");
  thead.innerHTML = `
    <th>項目</th>
    <th colspan="3" class="col-a" style="border-right:1px solid var(--border)">${esc(pA.name)}</th>
    <th colspan="3" class="col-b">${esc(pB.name)}</th>`;

  // 既存のsubHeadがあれば削除
  const oldSub = document.getElementById("b-subhead");
  if (oldSub) oldSub.remove();
  const subHead = document.createElement("tr");
  subHead.id = "b-subhead";
  subHead.innerHTML = `<th></th>
    <th class="col-a">A</th><th class="col-a">B</th><th class="col-avg" style="border-right:1px solid var(--border)">平均</th>
    <th class="col-b">A</th><th class="col-b">B</th><th class="col-avg">平均</th>`;
  thead.parentElement.insertBefore(subHead, document.getElementById("b-tbody"));

  const tbody = document.getElementById("b-tbody");
  tbody.innerHTML = "";

  let totalAvgA = 0, totalAvgB = 0;
  PARAMS.forEach(p => {
    const vaA = hasAa ? sA.A[p.key] : null;
    const vbA = hasBa ? sA.B[p.key] : null;
    const vaB = hasAb ? sB.A[p.key] : null;
    const vbB = hasBb ? sB.B[p.key] : null;
    const avA = [vaA,vbA].filter(v=>v!==null);
    const avB = [vaB,vbB].filter(v=>v!==null);
    const avgA = avA.length ? (avg(avA)).toFixed(1) : "—";
    const avgB = avB.length ? (avg(avB)).toFixed(1) : "—";
    if (avA.length) totalAvgA += parseFloat(avgA);
    if (avB.length) totalAvgB += parseFloat(avgB);

    const winA = avA.length && avB.length && parseFloat(avgA) > parseFloat(avgB);
    const winB = avA.length && avB.length && parseFloat(avgB) > parseFloat(avgA);

    tbody.innerHTML += `<tr>
      <td>${p.label}</td>
      <td class="${winA?'cell-win col-a':'cell-lose'}">${vaA??'—'}</td>
      <td class="${winA?'cell-win col-a':'cell-lose'}">${vbA??'—'}</td>
      <td class="${winA?'cell-win':'cell-lose'}" style="border-right:1px solid var(--border);font-weight:700">${avgA}</td>
      <td class="${winB?'cell-win col-b':'cell-lose'}">${vaB??'—'}</td>
      <td class="${winB?'cell-win col-b':'cell-lose'}">${vbB??'—'}</td>
      <td class="${winB?'cell-win':'cell-lose'}" style="font-weight:700">${avgB}</td>
    </tr>`;
  });

  const fAvgA = (totalAvgA/PARAMS.length).toFixed(1);
  const fAvgB = (totalAvgB/PARAMS.length).toFixed(1);
  tbody.innerHTML += `<tr class="total-row">
    <td>総合平均</td>
    <td colspan="2" class="col-a">—</td>
    <td style="border-right:1px solid var(--border);color:var(--gold)">${fAvgA}</td>
    <td colspan="2" class="col-b">—</td>
    <td style="color:var(--gold)">${fAvgB}</td>
  </tr>`;
}

function renderVoteStatus(winnerVotes, tData) {
  const { pair } = _bState;
  const myVote = winnerVotes[DEV];

  document.getElementById("vdot-a").className = "vdot"+(winnerVotes.A?" on":"");
  document.getElementById("vdot-b").className = "vdot"+(winnerVotes.B?" on":"");
  document.getElementById("vote-btn-a").className = "vote-btn"+(myVote===pair.a?" sel-a":"");
  document.getElementById("vote-btn-b").className = "vote-btn"+(myVote===pair.b?" sel-b":"");

  // 両者投票済みなら結果表示
  if (winnerVotes.A && winnerVotes.B) {
    const vA = Object.values(winnerVotes).filter(v=>v===pair.a).length;
    const vB = Object.values(winnerVotes).filter(v=>v===pair.b).length;
    const res = document.getElementById("b-result");
    res.classList.add("show");
    if (vA>vB) {
      res.classList.add("win");
      document.getElementById("b-result-title").textContent = `🏆 ${_bState.pA.name} の勝利！`;
    } else if (vB>vA) {
      res.classList.add("win");
      document.getElementById("b-result-title").textContent = `🏆 ${_bState.pB.name} の勝利！`;
    } else {
      res.classList.add("draw");
      document.getElementById("b-result-title").textContent = "引き分け！";
    }
    document.getElementById("b-result-sub").textContent =
      `${_bState.pA.name}: ${vA}票 / ${_bState.pB.name}: ${vB}票`;

    // 次の試合があれば「次の試合へ」ボタンを表示
    const nextPi = _bState.pi + 1;
    if (tData && nextPi < _allPairs.length) {
      const nextBtn = document.getElementById("btn-next");
      nextBtn.style.display = "inline-block";
      nextBtn.onclick = () => {
        if (_bUnsub) { _bUnsub(); _bUnsub=null; }
        openBattle(tData, nextPi, _allPm);
      };
    }
  }
}

async function castWinnerVote(winnerId) {
  const { pi } = _bState;
  const key = "m" + pi; // Firestoreはオブジェクトキーを文字列で扱う
  const tRef = doc(db,"tournament","current");
  const td = (await getDoc(tRef)).data();
  if (!td.winners) td.winners = {};
  if (!td.winners[key]) td.winners[key] = {};
  td.winners[key][DEV] = winnerId;
  await updateDoc(tRef, { winners: td.winners });
}

// vote-btn listeners registered in openBattle

function closeBattle() {
  if (_bUnsub) { _bUnsub(); _bUnsub=null; }
  document.getElementById("vote-modal").style.display = "none";
  renderBracket();
}
document.getElementById("vote-close").addEventListener("click", closeBattle);
document.getElementById("btn-done").addEventListener("click", closeBattle);
</script>
